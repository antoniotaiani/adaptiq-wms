# Configurazione Alembic per l'uso da riga di comando (sviluppo).
# All'avvio dell'app le migrazioni vengono applicate da app/db_migrations.py, senza usare questo file.
#
# Nuova migrazione (dentro il container):
#   docker compose exec web alembic -c app/migrations/alembic.ini revision --autogenerate -m "descrizione"
# Stato attuale del DB:
#   docker compose exec web alembic -c app/migrations/alembic.ini current

[alembic]
script_location = %(here)s
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
